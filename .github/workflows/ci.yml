name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Backend gates (pytest, ruff, eval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend with dev extras
        run: pip install -e "./backend[dev]"
      - name: Ruff lint
        working-directory: backend
        run: ruff check .
      - name: Pytest (444 tests, sqlite, no services)
        working-directory: backend
        run: python -m pytest -q
      - name: Evaluation Dataset / Golden Cases regression (Q77 staging gate)
        run: python eval/runner.py

  frontend:
    name: Frontend gates (tsc, six checkers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Six frontend contract checkers
        run: |
          node scripts/check-tokens.mjs
          node scripts/check-nav.mjs
          node scripts/check-products.mjs
          node scripts/check-workbench.mjs
          node scripts/check-compliance.mjs
          node scripts/check-admin.mjs
