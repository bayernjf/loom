name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Q301：同一 ref 连推时取消旧 run——PR #150 曾堆出一串 cancelled 重复 run，
# 旧 run 继续跑完只烧 CI 额度且让红叉状态难以判读。不同 ref（如并发 PR）互不取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend gates (pytest, ruff, eval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend from requirements-dev.lock
        run: |
          pip install -r backend/requirements-dev.lock
          pip install -e ./backend --no-deps
      - name: Ruff lint
        working-directory: backend
        run: ruff check .
      - name: Pytest (sqlite, no services)
        working-directory: backend
        # --cov adds measurement only; docs/16 §4's coverage thresholds stay 【建议】
        # and are deliberately not enforced here - turning them into a gate is a ruling.
        run: python -m pytest -q --cov=app --cov-report=json:coverage.json --cov-report=term
      - name: Coverage report (measurement only, never a gate)
        if: always()
        working-directory: backend
        run: python scripts/coverage_report.py coverage.json
      - name: Evaluation Dataset / Golden Cases regression (Q77 staging gate)
        run: python eval/runner.py

  frontend:
    name: Frontend gates (tsc, eight checkers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Eight frontend contract checkers
        run: |
          node scripts/check-tokens.mjs
          node scripts/check-nav.mjs
          node scripts/check-content.mjs
          node scripts/check-products.mjs
          node scripts/check-workbench.mjs
          node scripts/check-compliance.mjs
          node scripts/check-admin.mjs
          node scripts/check-settings.mjs

  # Q207：真 PG16 上的迁移与 ORM 漂移门。此前这四件事只在本地一次性容器里手工做
  # （DBA 复核 Q153/Q171/Q179 各是一批），所以"模型⇄迁移零漂移"每隔几十片就要人工
  # 重新证明一次，而 compose/迁移类改动在 CI 里完全看不见。
  # 刻意不用 `alembic check`：实测它在 HEAD 上报 19 条差异，全是索引命名
  # （手写迁移 ix_audit_entity vs ORM 自动名 ix_audit_logs_entity_id）与一处
  # "唯一约束 vs 唯一索引"，是永久红，不能当门。dba_schema_check.py 按列集比对，
  # 正是为了不被命名差异牵着走。
  migration:
    name: "Migration gate (real PG16: upgrade, ORM drift, downgrade)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom-ci-only
          POSTGRES_DB: loom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LOOM_DATABASE_DSN: postgresql+asyncpg://loom:loom-ci-only@localhost:5432/loom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend from requirements-dev.lock
        run: |
          pip install -r backend/requirements-dev.lock
          pip install -e ./backend --no-deps
      - name: Alembic upgrade head on a fresh database
        working-directory: backend
        run: alembic upgrade head
      - name: ORM ⇄ DB schema drift check
        working-directory: backend
        run: python scripts/dba_schema_check.py
      - name: Downgrade one revision and upgrade back (reversibility)
        working-directory: backend
        run: |
          alembic downgrade -1
          alembic upgrade head

  # Q209：real-infra 真容器集成验证进 CI。Q207 已经证明 CI 能起 pgvector/pg16
  # service，「真容器进不了 CI」这个前提是被 Q207 自己拆掉的，只是没人回头收——
  # 于是 docs/20 §9.3 第 4 条与 §10.1 里「real-infra 8 例不在 CI」这半句一直挂着。
  # 这片测的是替身（FencingRedis/FakeStreamsRedis/FakeBroadcastRedis/sqlite）证不了的：
  # 真 PG 跨连接池的提交可见性与行级锁串行化、真 Redis 的 SET NX/INCR/Lua 释放、
  # Streams 消费组分片与 XCLAIM 接管、pub/sub 跨连接投递。
  real-infra:
    name: "Real infra gate (PG16 + Redis: fencing, streams, pub/sub)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom-ci-only
          POSTGRES_DB: loom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LOOM_TEST_REAL_PG_DSN: postgresql+asyncpg://loom:loom-ci-only@localhost:5432/loom
      LOOM_TEST_REAL_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend from requirements-dev.lock
        run: |
          pip install -r backend/requirements-dev.lock
          pip install -e ./backend --no-deps
      - name: Real-infra integration tests (any skip fails the job)
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_real_infra.py -q -rs | tee real-infra.log
          # 哨兵：这一族用例靠 env 门控，env 没设时 pytest 是「全 skip + exit 0」——
          # 那样这个 job 会永远绿而从没跑过一行真断言。只在真容器上跑绿的检查
          # 等于没有检查（Q193/Q204 同型教训），所以这里显式判红「有 skip」。
          # 刻意不钉用例数（加一例就假红，Q207 不钉表数是同一个理由）。
          summary="$(tail -n 1 real-infra.log)"
          echo "pytest summary: ${summary}"
          case "${summary}" in
            *"no tests ran"*)
              echo "::error::real-infra 一个用例都没收集到，检查路径是否被改"
              exit 1
              ;;
            *skipped*)
              echo "::error::real-infra 用例被 skip（通常是两个 LOOM_TEST_REAL_* env 没生效）——静默绿灯等于没跑"
              exit 1
              ;;
            *passed*) ;;
            *)
              echo "::error::real-infra 没有 passed 用例，summary 无法判定"
              exit 1
              ;;
          esac

  # Q227：fullchain-rehearsal 进 CI（带 skip 哨兵）。Q223 登记「CI 常绿的链是 synthetic
  # 跑的」——此前真 PG + alembic + e2e 全链只在本地 infra/fullchain-rehearsal.sh 手动
  # 跑，CI 绿不证明生产路径（Q224 又一次证实）。和 real-infra/migration 同型，pgvector
  # service + 哨兵防静默绿灯。只跑 synthetic 变体（不花真 LLM token），real-LLM 留给
  # 手动 fullchain-rehearsal.sh LOOM_E2E_REAL_LLM=1。
  fullchain-e2e:
    name: "Fullchain e2e (synthetic PG: alembic → golden path)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom-ci-only
          POSTGRES_DB: loom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LOOM_DATABASE_DSN: postgresql+asyncpg://loom:loom-ci-only@localhost:5432/loom
      LOOM_E2E_PG_DSN: postgresql+asyncpg://loom:loom-ci-only@localhost:5432/loom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend from requirements-dev.lock
        run: |
          pip install -r backend/requirements-dev.lock
          pip install -e ./backend --no-deps
      - name: Alembic upgrade head on a fresh database
        working-directory: backend
        run: alembic upgrade head
      - name: Fullchain e2e (synthetic only, any skip fails the job)
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest tests/e2e -q -rs -k synthetic | tee fullchain-e2e.log
          summary="$(tail -n 1 fullchain-e2e.log)"
          echo "pytest summary: ${summary}"
          case "${summary}" in
            *"no tests ran"*)
              echo "::error::fullchain-e2e 一个用例都没收集到，检查路径或 -k synthetic 是否失效"
              exit 1
              ;;
            *skipped*)
              echo "::error::fullchain-e2e 用例被 skip（通常是 LOOM_E2E_PG_DSN 没生效）——静默绿灯等于没跑"
              exit 1
              ;;
            *passed*) ;;
            *)
              echo "::error::fullchain-e2e 没有 passed 用例，summary 无法判定"
              exit 1
              ;;
          esac

  # Q229（A3 裁「只加廉价等价门」）：六套演练里**不需要多容器／宿主网络**的那一半
  # 静态化进 CI——搬的是等价断言，不是脚本本体。两件事此前只被本地演练验过：
  #   1. compose 各 overlay 组合能静态解析（不启动任何容器）。单元测试只断言结构，
  #      验不了解析与合并；Q185 那两个「project 判 invalid」的缺陷正落在这一层。
  #   2. promtool check config/rules。告警规则的 PromQL **语法**至今无人守：单元测试
  #      只用正则抽指标名比对注册表，语法写错会一路绿到生产——规则加载失败＝没有告警。
  # ha/load/restore/rpo-rto/pitr 要起多容器、断言依赖宿主网络（网络分区、备份异机恢复、
  # WAL 归档），维持本地手动，是登记的代价判断而非遗漏（BENCHMARK.md / docs/17 §7）。
  infra-static:
    name: "Infra static gate (compose resolve + promtool rules)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose overlays resolve statically (no containers)
        working-directory: infra
        run: |
          set -euo pipefail
          # a) 默认部署路径必须**不注入任何 secret** 就能解析：base 里若有人加
          #    `${X:?}`，compose 的解析期全局求值会连不开监控的默认路径一起打断
          #    （Q185 实测踩到，故 Grafana 口令的护栏只许待在 opt-in overlay）。
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.staging.yml config -q
          # Q279 甲案：网关 overlay 也必须在**零注入 secret** 的默认路径上可解析
          # （它只带 ${LOOM_GATEWAY_DOMAIN:-…}，没有口令类插值）。
          docker compose -f docker-compose.yml -f docker-compose.gateway.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.staging.yml \
            -f docker-compose.ha.yml config -q
          # b) opt-in overlay 叠进来后仍得是一个合法 project：护栏只约束 -f 进来的人，
          #    故这里按演练口径注入一次性口令，验证合并结果本身可解析。
          LOOM_GRAFANA_ADMIN_PASSWORD=ci-only docker compose \
            -f docker-compose.yml -f docker-compose.monitoring.yml \
            --profile monitoring config -q
          LOOM_GRAFANA_ADMIN_PASSWORD=ci-only docker compose \
            -f docker-compose.yml -f docker-compose.staging.yml \
            -f docker-compose.monitoring.yml -f docker-compose.alerting-rehearsal.yml \
            -p loom-alerting --profile monitoring config -q
      - name: Prometheus config and rules validate statically (promtool)
        working-directory: infra
        run: |
          set -eo pipefail
          # 钉版本而非 :latest：门要可复现，compose 里跑的那个浮动是运行面的事。
          PROMTOOL=(docker run --rm -v "$PWD/monitoring":/etc/prometheus:ro
            --entrypoint /bin/promtool quay.io/prometheus/prometheus:v3.14.0)
          "${PROMTOOL[@]}" check config /etc/prometheus/prometheus.yml | tee promtool-config.log
          "${PROMTOOL[@]}" check rules /etc/prometheus/alert_rules.yml | tee promtool-rules.log
          # 哨兵：promtool 对「0 条规则」同样报 SUCCESS，规则文件被清空或挂载路径写错时
          # 语法检查照绿——不比条数更弱的判据会静默放过「规则根本没装载」。
          # 刻意不钉死条数（加一条规则不该假红，Q207 不钉表数、real-infra 不钉用例数同理由），
          # 只判「解析出了 ≥1 条」。
          summary="$(grep -F 'rules found' promtool-rules.log | tail -n 1 || true)"
          echo "promtool: ${summary:-<无 rules found 行>}"
          case "${summary}" in
            *"SUCCESS: 0 rules found"*)
              echo "::error::alert_rules.yml 解析出 0 条规则（被清空或挂载路径错）——语法绿不等于规则装载"
              exit 1
              ;;
            *"SUCCESS:"*"rules found"*) ;;
            *)
              echo "::error::promtool 未报出规则数，无法判定"
              exit 1
              ;;
          esac
      - name: Caddyfile validates statically (caddy validate + adapt)
        working-directory: infra
        run: |
          set -eo pipefail
          # Q279 甲案：与 promtool 同法——钉具体版本、在容器里跑，门要可复现。
          CADDY=(docker run --rm -v "$PWD/caddy":/etc/caddy:ro caddy:2.10.2)
          "${CADDY[@]}" caddy validate --config /etc/caddy/Caddyfile 2>&1 | tee caddy-validate.log
          # 哨兵（promtool「0 条规则也报 SUCCESS」同款陷阱）：空 Caddyfile 照样 valid。
          # 判据取「源文件写了几个转发块」与「适配后的 JSON 里真有几个」相等——挂载路径写错
          # 或文件被清空时两者立刻分叉；刻意不钉死总数（新增一条放行面不该假红）。
          "${CADDY[@]}" caddy adapt --config /etc/caddy/Caddyfile > caddy-adapted.log
          src=$(grep -c '^[[:space:]]*reverse_proxy ' caddy/Caddyfile)
          json=$(grep -o '"handler":"reverse_proxy"' caddy-adapted.log | wc -l | tr -d ' ')
          echo "caddy: reverse_proxy 源文件=${src} 适配后=${json}"
          [ "${json}" -gt 0 ] || { echo "::error::适配 JSON 里一个转发块都没有——网关面没被装载"; exit 1; }
          [ "${src}" = "${json}" ] || { echo "::error::源文件 ${src} 与适配结果 ${json} 转发块数不符"; exit 1; }
          grep -q '"handler":"static_response"' caddy-adapted.log \
            || { echo "::error::docs/探针面的拦截块消失了（/docs·/metrics 会直接暴露在后端）"; exit 1; }
          grep -q 'backend:8000' caddy-adapted.log && grep -q 'frontend:3000' caddy-adapted.log \
            || { echo "::error::上游地址缺失，转发目标与 compose 服务名不再一致"; exit 1; }
