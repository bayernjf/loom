# Evaluation Dataset — DIM-MERGE（WF-02 段3，回归矩阵，Q78 切片自带）
# target=PT-FP-PLAN-V2.0 确定性结构校验（docs/06 §2.1）：Q8 启用路由、
# Q9 细看线 0.85、Q10 疑重线 0.9（仅标记）、Q11 敏感行业 risk_control、
# Q12 Top8+备选/不足 3、line 14081 依据必填。数据均为人工编写合成数据（16 §4）。
skill_id: DIM-MERGE
wf_id: WF-02
cases:
  - id: dm-fp-001
    title: 合规三维度全过（≥1 product_attribute，置信全在线上）
    target: evaluate_plan
    input:
      sensitive: false
      enabled_routes: [user_input, g2_frequent, compliance_risk]
      active_fids: [f_a]
      dimensions:
        - {field_name: 颜色, role: product_attribute, source_route: user_input, confidence: 0.95, source_ref: syn-ref-1}
        - {field_name: 材质, role: product_attribute, source_route: g2_frequent, confidence: 0.9, source_ref: syn-ref-2, fid: f_a}
        - {field_name: 卖点, role: product_attribute, source_route: user_input, confidence: 0.86, source_ref: syn-ref-3}
    expected:
      compliant: true
      violations: []
      selected_count: 3
      backup_count: 0
      needs_detail_fields: []
      dup_fields: []
    source: {refs: [PT-FP-PLAN-V2.0, Q8, Q12, "06 §2.1"]}

