# Q279 甲案：仓内 Caddy 网关 overlay（docs/17 §1.3）。
#
# 起法：
#   docker compose -f docker-compose.yml -f docker-compose.gateway.yml up -d
#
# 这个 overlay 只干两件事：
#   1) 加一个 caddy 容器，它是**唯一**对宿主开应用口的服务（80 只为 ACME 签发与跳转）；
#   2) 把 base 里 frontend 的 3000:3000 收回内部网络——否则「后端在网关后」这句话
#      不成立：绕过网关直打 3000 就绕过了 TLS 与放行面。
#
# 证书必须落在命名卷：/data 里没有证书，每次 up 都会重新签发，
# 而 Let's Encrypt 的签发速率限额会把「重启」变成「今天签不出证书」。

x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  caddy:
    image: caddy:2.10.2
    ports: ["80:80", "443:443"]
    environment:
      # Caddyfile 里也有同一个默认值，两处必须一致（由
      # tests/unit/test_gateway_surface_contract.py 钉住）。
      LOOM_GATEWAY_DOMAIN: ${LOOM_GATEWAY_DOMAIN:-loom.bayjf.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    restart: unless-stopped
    logging: *default-logging

  frontend:
    ports: !reset []

  backend:
    environment:
      # 评审 P1-2（2026-11-02）：网关形态 = 公网可达面，staff 身份门控默认必须开，
      # 不继承 base 的 :-false。门控关时 154 个写口只校验 body/query 自报角色，
      # 任何绕过网关直连 backend 的路径都会全盘失守。
      # 保留 :-true 而非字面 true：允许运维显式置 false 回滚（docs/17 §1.3）。
      # 首枚 staff 令牌无需临时关闸：直接跑 backend/scripts/bootstrap_staff_key.py
      # 写库签发后以门控开重启即可，未配置则 fail-closed。本机 dev 不起本 overlay，不受影响。
      LOOM_STAFF_AUTH_ENABLED: ${LOOM_STAFF_AUTH_ENABLED:-true}

volumes:
  caddy_data: {}
  caddy_config: {}
