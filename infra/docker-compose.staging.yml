# Staging overlay (Q147 rehearsal; Q148 real-LLM verification).
# Resets host port publishing on the infra services so the staging stack
# coexists with the local atlas-pg container; only the frontend is reachable
# from the host. The backend points at the agnes OpenAI-compatible endpoint
# (endpoint only — the outbound key is provisioned at runtime via admin API
# and stored encrypted). Use with:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  minio:
    ports: !reset []
    # No V1 service consumes S3; skip when the image cannot be pulled.
    profiles: [unused-in-rehearsal]
  # Q185：wal-archiver 硬依赖 minio（mc 推对象存储），彩排网格里没有 minio 时会
  # 无限重启并拖住 `--wait`，故随 minio 一起移出。真实部署不带本 overlay 即照常起。
  wal-archiver:
    profiles: [unused-in-rehearsal]
  backend:
    environment:
      LOOM_LLM_BASE_URL_OPENAI: https://apihub.agnes-ai.com/v1
