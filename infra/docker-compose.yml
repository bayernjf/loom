# Loom V1 local infrastructure (docs/17 §1: docker-compose single host).
# Infra services (postgres/redis/minio) plus app services for the controlled
# private beta (Q144 checklist #4/#5): only the frontend publishes a host
# port; the backend stays on the internal compose network.
x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Q182：开启 WAL 归档——archive_command 把段复制到共享卷，由 wal-archiver 推 MinIO。
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - wal_level=replica
      - -c
      - archive_timeout=300
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-loom}
    # Q200 #33：数据口只绑宿主回环，不再向局域网/公网暴露（本机 psql 仍可达）。
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal-archive
      # Q182：首次初始化追加 replication pg_hba 条目（供 db-basebackup 连接）。
      - ./wal/init-replica-hba.sh:/docker-entrypoint-initdb.d/zz-replica-hba.sh:ro
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U loom"], interval: 5s, timeout: 3s, retries: 10}
    depends_on:
      # Q185：归档卷属主必须先于 postgres 初始化就绪（见 wal-archive-init）。
      wal-archive-init: {condition: service_completed_successfully}
    # Q200 #33：三 datastore 统一补 restart（Q199 §7.4 判据），宿主重启后数据面自愈。
    restart: unless-stopped
    logging: *default-logging
  # Q185：空命名卷的挂载点默认 root:root，而官方镜像的 initdb.d 脚本以 postgres
  # （uid 999）身份运行、改不动属主（chown/chmod 双双 EPERM → postgres exit 1）。
  # 故用一个一次性 root 容器先把属主交给 postgres；复用 pg 镜像不额外拉新镜像。
  wal-archive-init:
    image: pgvector/pgvector:pg16
    user: root
    entrypoint: ["sh", "-c", "chown 999:999 /wal-archive && chmod 700 /wal-archive"]
    volumes: [walarchive:/wal-archive]
    restart: "no"
    logging: *default-logging
  redis:
    image: redis:7
    # Q200 #33：同 postgres，数据口只绑宿主回环。
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
    # Q200 #33：同 postgres。
    restart: unless-stopped
    logging: *default-logging
  minio:
    # Docker Hub 用户命名空间镜像在本机拉取受限，统一用 quay.io 官方源。
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # Q200 #33：API 与 console 只绑宿主回环。
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    # Q200 #33：同 postgres。
    restart: unless-stopped
    logging: *default-logging
  backend:
    build: {context: .., dockerfile: backend/Dockerfile}
    environment:
      LOOM_DATABASE_DSN: postgresql+asyncpg://${POSTGRES_USER:-loom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-loom}
      LOOM_REDIS_DSN: redis://redis:6379/0
      # Q200 #33：空值由 backend/docker-entrypoint.sh 启动即 fail-fast
      # （不放 ${VAR:?}：compose 解析期全局求值会打断彩排/监控 overlay，见 Q185）。
      LOOM_MASTER_KEY: ${LOOM_MASTER_KEY:-}
      # Endpoint only; the outbound key lives encrypted in the database, never in env/files.
      LOOM_LLM_BASE_URL_OPENAI: ${LOOM_LLM_BASE_URL_OPENAI:-}
    expose: ["8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    logging: *default-logging
  frontend:
    build: {context: .., dockerfile: frontend/Dockerfile}
    environment:
      LOOM_API_BASE_URL: http://backend:8000
      LOOM_TENANT_ID: ${LOOM_TENANT_ID:-beta-tenant}
      LOOM_ACTOR_ID: ${LOOM_ACTOR_ID:-ops-actor}
      LOOM_ADMIN_ACTOR_ID: ${LOOM_ADMIN_ACTOR_ID:-admin-actor}
      LOOM_ADMIN_ROLES: ${LOOM_ADMIN_ROLES:-platform_admin}
    ports: ["3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
  db-backup:
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: postgres
      PGUSER: loom
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-loom}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup:/scripts:ro
      - pgbackups:/backups
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    logging: *default-logging
  watchdog:
    image: python:3.12-slim
    environment:
      BACKEND_HEALTH_URL: http://backend:8000/healthz
      FRONTEND_URL: http://frontend:3000/
      LOOM_ALERT_WEBHOOK: ${LOOM_ALERT_WEBHOOK:-}
      WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-30}
    volumes:
      - ./monitoring:/monitor:ro
    command: ["python", "/monitor/watchdog.py"]
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    restart: unless-stopped
    logging: *default-logging
  db-basebackup:
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: postgres
      PGUSER: loom
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BASEBACKUP_INTERVAL_SECONDS: ${BASEBACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./wal:/scripts:ro
      - basebackups:/basebackups
    entrypoint: ["/bin/sh", "/scripts/base-backup.sh"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    logging: *default-logging
  wal-archiver:
    image: quay.io/minio/mc:latest
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      WAL_BUCKET: ${WAL_BUCKET:-loom-wal}
      WAL_ARCHIVE_INTERVAL_SECONDS: ${WAL_ARCHIVE_INTERVAL_SECONDS:-60}
    volumes:
      - ./wal:/scripts:ro
      # 推送成功后脚本删除已归档段，故需可写（非只读）。
      - walarchive:/wal-archive
      - basebackups:/basebackups
    entrypoint: ["/bin/sh", "/scripts/archive-wal.sh"]
    depends_on:
      # minio 可被 overlay 挪到非激活 profile（staging/ha 彩排即如此），故声明为可选
      # 依赖；否则 `required` 默认 true 会让整个 compose project 判为 invalid。
      minio: {condition: service_started, required: false}
    restart: unless-stopped
    logging: *default-logging
# Q181 的 Prometheus 与 Q185 的 Grafana 移入 docker-compose.monitoring.yml 独立
# overlay。原因：compose 的 `${VAR:?}` 插值在**解析期全局求值**、与 profile 是否激活
# 无关，把 Grafana 管理员口令的必填护栏留在此处会连带打断不开监控的默认部署路径。
# 告警投递不开独立组件，由 watchdog 轮询 Prometheus 转发（见 monitoring overlay）。
volumes: {pgdata:, redisdata:, miniodata:, pgbackups:, walarchive:, basebackups:}
