# Loom V1 local infrastructure (docs/17 §1: docker-compose single host).
# Infra services (postgres/redis/minio) plus app services for the controlled
# private beta (Q144 checklist #4): only the frontend publishes a host port;
# the backend stays on the internal compose network and is never exposed.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: loom, POSTGRES_PASSWORD: loom, POSTGRES_DB: loom}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U loom"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  backend:
    build: {context: .., dockerfile: backend/Dockerfile}
    environment:
      LOOM_DATABASE_DSN: postgresql+asyncpg://loom:loom@postgres:5432/loom
      LOOM_REDIS_DSN: redis://redis:6379/0
      LOOM_MASTER_KEY: ${LOOM_MASTER_KEY:-}
    expose: ["8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build: {context: .., dockerfile: frontend/Dockerfile}
    environment:
      LOOM_API_BASE_URL: http://backend:8000
      LOOM_TENANT_ID: ${LOOM_TENANT_ID:-beta-tenant}
      LOOM_ACTOR_ID: ${LOOM_ACTOR_ID:-ops-actor}
      LOOM_ADMIN_ACTOR_ID: ${LOOM_ADMIN_ACTOR_ID:-admin-actor}
      LOOM_ADMIN_ROLES: ${LOOM_ADMIN_ROLES:-platform_admin}
    ports: ["3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
volumes: {pgdata:, redisdata:, miniodata:}
